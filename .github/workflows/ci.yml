#name shown in github actions tab
name: CI

#run this workflow on every push to main
# and on every PULL REQUEST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


#WHAT JOBS TO RUN

jobs:
  # job name (jo sahi lge woh choosekr)
  type-check:
    # WHERE: Use Github's free Ubuntu machiine
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      
      #step 1: download the repo onto ubuntu machine
      - name: Checkout code
        uses: actions/checkout@v4

      #step 2: install Bun(current package manager)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      
      #step 3: Install all dependencies(like running bun install locally)
      - name: Install dependencies
        run: bun install
      
      #step 4: generate prisma client
      - name: generat prisma client
        run: bunx prisma generate
        working-directory: packages/db
      
      #step 5: Run TS type checking acroos all pakcages via turbo
      - name: Type checking
        run: bun run check-types

      #step 6: Run backend tests
      - name: Run backend tests
        run: bun test
        working-directory: apps/backend 
        env:
          RESEND_API_KEY: ${{secrets.RESEND_API_KEY}}
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{secrets.JWT_SECRET}}
      
      #step 7: Deploy to Railway (only on push to main, after all checks pass)
      - name: Deploy to Railway
        if: github.ref == 'refs/heads/main'
        run: |
          curl -s -X POST \
           https://backboard.railway.app/graphql/v2 \
           -H "Authorization: Bearer ${{secrets.RAILWAY_TOKEN}}" \
           -H "Content-Type: application/json" \
           -d "{\"query\":\"mutation{serviceInstanceRedeploy(serviceId:\\\"${{secrets.RAILWAY_SERVICE_ID}}\\\")}\"}"

