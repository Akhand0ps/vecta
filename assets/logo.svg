<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="vecta-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="vecta-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="vecta-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Vector Wing -->
  <path
    d="M24 28 L46 28 L64 80 L52 80 Z"
    fill="url(#vecta-primary)"
    filter="url(#glow)"
  />

  <!-- Right Vector Wing -->
  <path
    d="M104 28 L82 28 L56 94 L68 94 Z"
    fill="url(#vecta-primary)"
    filter="url(#glow)"
  />

  <!-- Forward Apex Chevron -->
  <path
    d="M64 80 L76 46 L88 46 L68 100 L56 100 Z"
    fill="url(#vecta-accent)"
  />

  <!-- Central Dynamic Facet -->
  <path
    d="M46 28 L58 60 L64 44 L54 28 Z"
    fill="url(#vecta-accent)"
    opacity="0.9"
  />
</svg>
